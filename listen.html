<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stop Chasing. Start Attracting. | BrightPulse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="logo_favicon.png" />

  <style>
    :root {
      --turquoise: #00c4cf;
      --card-radius: 32px;
      --shadow-strong: 0 30px 80px rgba(0, 0, 0, 0.55);
    }
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    
    body {
      margin: 0; 
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e2f3ff;
      
      /* SECRETUL PENTRU POZITIONARE CORECTA: */
      display: flex; 
      flex-direction: column; /* Aseaza elementele unul sub altul */
      align-items: center;    /* Le centreaza pe orizontala */
      justify-content: flex-start; /* Le porneste de SUS, nu de la mijloc */
      
      padding-top: 50px; /* Cat de sus sa fie (poti pune 40px sau 60px) */
      padding-bottom: 20px;
      padding-left: 20px;
      padding-right: 20px;
      
      background: radial-gradient(circle at top, rgba(0, 101, 114, 0.92), rgba(1, 8, 23, 0.97) 80%), url("background.png") center/cover no-repeat;
      background-attachment: fixed; /* Tine fundalul fix cand scrollezi */
    }

    .card {
      background: radial-gradient(circle at top, #03424f, #02121c 85%);
      border-radius: var(--card-radius);
      padding: 40px 30px;
      box-shadow: var(--shadow-strong);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 180, 190, 0.25);
      width: 100%; max-width: 420px;
      text-align: center; position: relative; overflow: hidden;
      
      /* Siguranta extra ca sa nu iasa din ecran */
      flex-shrink: 0; 
    }
    
    .card::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at top, rgba(0, 190, 200, 0.14), rgba(0, 40, 55, 0.55) 65%);
    }
    .content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
    
    .logo-small { 
      width: 45px; 
      opacity: 0.9; 
      margin-top: 20px;    
      margin-bottom: 15px; 
    }
    
    .player {
      width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      background: #000;
    }
    .player iframe { width: 100%; height: 100%; border: 0; display: block; }
    h1 {
      font-size: 26px; line-height: 1.2; margin: 0 0 10px;
      background: linear-gradient(to right, #fff, #00c4cf);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-transform: uppercase; letter-spacing: 1px;
    }
    p.subtitle { font-size: 15px; color: #b0e0e6; margin-bottom: 35px; opacity: 0.9; }
    
    .listen-btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      background-color: #FF0000; color: white; text-decoration: none;
      font-weight: 700; font-size: 18px; padding: 20px; width: 100%;
      border-radius: 99px; box-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
      transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;
    }
    .listen-btn:hover { transform: scale(1.05); background-color: #ff2a2a; box-shadow: 0 0 50px rgba(255, 0, 0, 0.7); }
    .listen-icon { width: 28px; height: 28px; }
    .footer { margin-top: 30px; font-size: 11px; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="content">
      
      <div class="player">
        <iframe
          src="https://www.youtube-nocookie.com/embed/videoseries?list=PLVJ9FM9AXbho"
          title="Feminine Frequency Music – Vol. I"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>
      </div>

      <img src="logo.png" alt="BrightPulse" class="logo-small">

      <h1>Stop Chasing.<br>Start Attracting.</h1>
      <p class="subtitle">Neuro-acoustic frequencies for magnetic feminine energy.</p>

      <a href="https://music.youtube.com/channel/UCAvWzAg5aVYqdy33U_C0hqg"
         class="listen-btn"
         target="_blank" rel="noopener noreferrer">
        <img src="YouTube Music.png" class="listen-icon" alt="">
        Listen on YouTube Music
      </a>

      <div class="footer">© 2025 BrightPulse Studio</div>
    </div>
  </div>
</body>
</html>
